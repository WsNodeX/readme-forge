<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-label="readme-forge">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#8957e5"/>
    </linearGradient>
  </defs>

  <!-- mark: a document with a strike-through and a check -->
  <rect x="36" y="46" width="128" height="128" rx="28" fill="url(#g1)"/>
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M74 88 h52"/>
    <path d="M74 110 h52"/>
    <path d="M74 132 h30"/>
  </g>
  <!-- struck-out line -->
  <path d="M70 110 h60" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.35"/>
  <path d="M118 54 l16 16" stroke="#ffffff" stroke-width="0" fill="none"/>
  <!-- check mark -->
  <path d="M112 150 l12 12 24 -28" stroke="#3fb950" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- wordmark -->
  <text x="200" y="118" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="62" font-weight="700" fill="#1f2328" letter-spacing="-1.5">readme<tspan fill="#1f6feb">forge</tspan></text>
  <text x="202" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="19" fill="#59636e">deletes what your AI wrote for itself</text>
</svg>
